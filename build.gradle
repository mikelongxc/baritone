plugins { id 'java' }
group = 'dev.autostore'
version = '26.3-autostore-2.7.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
def locks = new groovy.json.JsonSlurper().parse(file('tools/dependencies.json'))
def libraries = locks.collect { file('deps/' + it.name) } + [file('deps/orbit-0.2.4.jar')]
sourceSets {
    main {
        java.srcDirs = ['src/api/java','src/main/java','src/launch/java','fabric/src/main/java','src/schematica_api/java']
        resources.srcDirs = ['src/main/resources','src/launch/resources','fabric/src/main/resources']
    }
    test { java.srcDirs = ['src/test/java/dev'] }
}
dependencies {
    compileOnly files(libraries)
    testImplementation files('deps/junit-platform-console-standalone-1.12.2.jar')
    testImplementation fileTree('deps') { include '*gson*.jar'; include 'asm*.jar' }
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-proc:none', '-Xlint:unchecked'] }
test {
    useJUnitPlatform()
    systemProperty 'autostore.runtimeJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'autostore.version', project.version.toString()
}
processResources {
    inputs.property('modVersion', project.version.toString())
    filesMatching('fabric.mod.json') { expand version: project.version }
}
def pathfinderJar = tasks.register('packagePathfinder', Jar) {
    dependsOn 'verifyDependencies'
    archiveFileName = 'nether-pathfinder-1.6-fabric.jar'
    destinationDirectory = layout.buildDirectory.dir('bundled')
    from(zipTree('deps/nether-pathfinder-1.6.jar')) { exclude 'META-INF/MANIFEST.MF' }
    from('src/dependencyMetadata/nether-pathfinder')
}
jar {
    exclude 'com/github/lunatrius/**', 'fi/dy/masa/**'
    from('LICENSE') { rename { 'LICENSE-Baritone' } }
    from('LICENSE-AutoStore')
    from(pathfinderJar) { into 'META-INF/jars' }
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('verifyDependencies') {
    doLast {
        locks.each { entry ->
            def artifact=file('deps/'+entry.name)
            if (!artifact.isFile()) throw new GradleException('Run python3 tools/bootstrap.py first.')
            def actual=java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance(entry.sha256 ? 'SHA-256':'SHA-1').digest(artifact.bytes))
            if(actual != (entry.sha256 ?: entry.sha1)) throw new GradleException('Dependency checksum mismatch: '+entry.name)
        }
    }
}
compileJava.dependsOn verifyDependencies

tasks.named("test") { dependsOn tasks.named("jar") }
